version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7-jammy
    container_name: web-scraping-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: web-scraping-auth
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - web-scraping-network

  # Web Application
  web-app:
    build: .
    container_name: web-scraping-app
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: production-jwt-secret-change-this-in-production
      JWT_EXPIRES_IN: 24h
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/web-scraping-auth?authSource=admin
    ports:
      - '3000:3000'
    volumes:
      - ./backend/.env.production:/app/.env.production:ro
    networks:
      - web-scraping-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local

networks:
  web-scraping-network:
    driver: bridge
